// que só existe dentro do chat). Aqui os dados ficam salvos no localStorage do
// navegador de quem estiver usando o site.
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v !== null ? { key, value: v } : null;
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

function Toggle({ label, value, onChange, hint }) {
  return (
    <div className="field">
      <div className="toggle-row">
        <div>
          <label>{label}</label>
          {hint && <div className="hint">{hint}</div>}
        </div>
        <div className="toggle-btns">
          <button
            type="button"
            className={`toggle-btn ${value === true ? "active" : ""}`}
            onClick={() => onChange(true)}
          >
            Sim
          </button>
          <button
            type="button"
            className={`toggle-btn ${value === false ? "active" : ""}`}
            onClick={() => onChange(false)}
          >
            Não
          </button>
        </div>
      </div>
    </div>
  );
}

function NumField({ label, value, onChange, placeholder, suffix, hint }) {
  return (
    <div className="field">
      <label>{label}</label>
      {hint && <div className="hint">{hint}</div>}
      <div className="input-suffix-wrap">
        <input
          type="number"
          inputMode="decimal"
          value={value}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
        />
        {suffix && <span className="suffix">{suffix}</span>}
      </div>
    </div>
  );
}

function TextField({ label, value, onChange, placeholder, hint, onBlur, listId, listOptions }) {
  return (
    <div className="field">
      <label>{label}</label>
      {hint && <div className="hint">{hint}</div>}
      <input
        type="text"
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        onBlur={onBlur}
        list={listId}
        autoComplete="off"
      />
      {listId && listOptions && (
        <datalist id={listId}>
          {listOptions.map((opt) => (
            <option key={opt} value={opt} />
          ))}
        </datalist>
      )}
    </div>
  );
}

function SelField({ label, value, onChange, options, hint }) {

      <label>{label}</label>
      {hint && <div className="hint">{hint}</div>}
      <select value={value} onChange={(e) => onChange(e.target.value)}>
        <option value="">Selecione...</option>
        {options.map((o) => (
          <option key={o.value} value={o.value}>
            {o.label}
          </option>
        ))}
      </select>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div className="section-card">
      <h3>{title}</h3>
      {children}
    </div>
  );
}

function riskBand(level) {
  if (level === "baixo") return { cls: "low", label: "Risco baixo" };
  if (level === "moderado") return { cls: "mid", label: "Risco moderado" };
  return { cls: "high", label: "Risco alto" };
}

function ScoreCard({ nome, valor, detalhe, nivel, base }) {
  const band = riskBand(nivel);
  return (
    <div className={`score-card ${band.cls}`}>
      <div className="score-top">
        <span className="score-nome">{nome}</span>
        <span className={`score-pill ${band.cls}`}>{band.label}</span>
      </div>
      <div className="score-valor">{valor}</div>
      <div className="score-detalhe">{detalhe}</div>
      {base && <div className="score-base">{base}</div>}
    </div>
  );
}

function App() {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(initialForm);
  const [cirurgioesHistorico, setCirurgioesHistorico] = useState([]);

  const CIRURGIOES_KEY = "cirurgioes-historico";

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(CIRURGIOES_KEY);
        setCirurgioesHistorico(res ? JSON.parse(res.value) : []);
      } catch {
        setCirurgioesHistorico([]);
      }
    })();
  }, []);

  const salvarCirurgiaoNoHistorico = async () => {
    const nome = form.nomeCirurgiao.trim();
    if (!nome || cirurgioesHistorico.includes(nome)) return;
    const atualizado = [...cirurgioesHistorico, nome].sort((a, b) =>
      a.localeCompare(b, "pt-BR")
    );
    setCirurgioesHistorico(atualizado);
    try {
      await storage.set(CIRURGIOES_KEY, JSON.stringify(atualizado));
    } catch {
      // se falhar, o nome ainda fica disponível nesta sessão
    }
  };

  const set = (key) => (val) => setForm((f) => ({ ...f, [key]: val }));

  const num = (v) => (v === "" || v === null || v === undefined ? null : parseFloat(v));

  const idade = num(form.idade);
  const peso = num(form.peso);
  const altura = num(form.altura);
  const spo2 = num(form.spo2);
  const creatinina = num(form.creatinina);
  const hb = num(form.hb);

  const bmi = useMemo(() => {
    if (!peso || !altura) return null;
    const alturaM = altura > 3 ? altura / 100 : altura;
    return peso / (alturaM * alturaM);
  }, [peso, altura]);

  const bmiClass = useMemo(() => {
    if (bmi === null) return "";
    if (bmi < 18.5) return "abaixo do peso";
    if (bmi < 25) return "peso normal";
    if (bmi < 30) return "sobrepeso";
    if (bmi < 35) return "obesidade grau I";
    if (bmi < 40) return "obesidade grau II";
    return "obesidade grau III";
  }, [bmi]);

  const categoriaRisco = CATEGORIA_RISCO[form.tipoIncisao] || "";

  const rcri = useMemo(() => {
    const highRiskSurgery = ["intraperitoneal", "intratoracica", "vascular"].includes(
      categoriaRisco
    );
    let pts = 0;
    if (highRiskSurgery) pts++;
    if (form.dac) pts++;
    if (form.icc) pts++;
    if (form.avcPrevio) pts++;
    if (form.dmInsulina) pts++;
    if (creatinina !== null && creatinina > 2.0) pts++;

    let classe, riscoPct, nivel;
    if (pts === 0) {
      classe = "I";
      riscoPct = "0,4%";
      nivel = "baixo";
    } else if (pts === 1) {
      classe = "II";
      riscoPct = "≈0,9%";
      nivel = "baixo";
    } else if (pts === 2) {
      classe = "III";
      riscoPct = "≈6,6%";
      nivel = "moderado";
    } else {
      classe = "IV";
      riscoPct = "≥11%";
      nivel = "alto";
    }
    return { pts, classe, riscoPct, nivel };
  }, [categoriaRisco, form.dac, form.icc, form.avcPrevio, form.dmInsulina, creatinina]);

  const stopBang = useMemo(() => {
    let pts = 0;
    if (form.ronco) pts++;
    if (form.sonolencia) pts++;
    if (form.apneiaObservada) pts++;
    if (form.has) pts++;
    if (bmi !== null && bmi > 35) pts++;
    if (idade !== null && idade > 50) pts++;
    if (form.sexo === "masculino") pts++;

    let nivel, label;
    if (pts <= 2) {
      nivel = "baixo";
      label = "baixo risco de AOS";
    } else if (pts <= 4) {
      nivel = "moderado";
      label = "risco intermediário de AOS";
    } else {
      nivel = "alto";
      label = "alto risco de AOS";
    }
    return { pts, nivel, label };
  }, [form.ronco, form.sonolencia, form.apneiaObservada, form.has, bmi, idade, form.sexo]);

  const ariscat = useMemo(() => {
    let pts = 0;
    if (idade !== null) {
      if (idade > 80) pts += 16;
      else if (idade >= 51) pts += 3;
    }
    if (spo2 !== null) {
      if (spo2 <= 90) pts += 24;
      else if (spo2 <= 95) pts += 8;
    }
    if (form.infeccaoResp) pts += 17;
    if (hb !== null && hb <= 10) pts += 11;
    if (categoriaRisco === "intratoracica") pts += 24;
    else if (categoriaRisco === "intraperitoneal") pts += 15;
    if (form.urgencia) pts += 8;

    let nivel, riscoPct;
    if (pts < 26) {
      nivel = "baixo";
      riscoPct = "≈1,6%";
    } else if (pts < 45) {
      nivel = "moderado";
      riscoPct = "≈13,3%";
    } else {
      nivel = "alto";
      riscoPct = "≈42%";
    }
    return { pts, nivel, riscoPct };
  }, [idade, spo2, form.infeccaoResp, hb, categoriaRisco, form.urgencia]);

  const apfel = useMemo(() => {
    let pts = 0;
    if (form.sexo === "feminino") pts++;
    if (!form.tabagismoAtual) pts++;
    if (form.historicoNveoCinetose) pts++;
    if (form.opioidePosOp) pts++;

    const riscoPorPontos = { 0: "≈10%", 1: "≈21%", 2: "≈39%", 3: "≈61%", 4: "≈79%" };
    let nivel;
    if (pts <= 1) nivel = "baixo";
    else if (pts === 2) nivel = "moderado";
    else nivel = "alto";

    return { pts, nivel, riscoPct: riscoPorPontos[pts] };
  }, [form.sexo, form.tabagismoAtual, form.historicoNveoCinetose, form.opioidePosOp]);

  const alertasClinicos = useMemo(() => {
    const alertas = [];
    if (form.alergiaMedicamentosa)
      alertas.push({
        titulo: "Alergia medicamentosa",
        mensagem: form.quaisAlergiasMedicamentosas
          ? `Medicamentos relatados: ${form.quaisAlergiasMedicamentosas}.`
          : "Confirmar detalhes com o paciente antes da indução.",
        nivel: "alto",
      });
    if (form.alergiaLatex)
      alertas.push({
        titulo: "Alergia a látex",
        mensagem: "Providenciar sala e material livres de látex.",
        nivel: "alto",
      });
    if (form.alergiaContraste)
      alertas.push({
        titulo: "Alergia a contraste iodado",
        mensagem: "Atenção se houver uso de contraste no procedimento; considerar pré-medicação conforme protocolo.",
        nivel: "alto",
      });
    if (form.iamRecente)
      alertas.push({
        titulo: "IAM recente (<60 dias)",
        mensagem: "Considerar adiar cirurgia eletiva e discutir otimização com a cardiologia antes de prosseguir.",
        nivel: "alto",
      });
    if (form.miasteniaGravis)
      alertas.push({
        titulo: "Miastenia gravis",
        mensagem: "Sensibilidade aumentada a bloqueadores neuromusculares não despolarizantes — ajustar dose e monitorização.",
        nivel: "alto",
      });
    if (form.stentCoronarianoRecente && form.duplaAntiagregacao) {
      alertas.push({
        titulo: "Stent coronariano recente + dupla antiagregação",
        mensagem: "Avaliar risco de trombose de stent vs. sangramento com a cardiologia antes de suspender antiagregantes.",
        nivel: "alto",
      });
    } else if (form.stentCoronarianoRecente) {
      alertas.push({
        titulo: "Stent coronariano recente",
        mensagem: "Confirmar tempo desde o implante e esquema atual de antiagregantes.",
        nivel: "moderado",
      });
    }
    if (form.marcapassoCdi)
      alertas.push({
        titulo: "Marcapasso / CDI",
        mensagem: "Verificar necessidade de reprogramação/ímã e interrogação do dispositivo antes e depois do uso de eletrocautério.",
        nivel: "moderado",
      });
    if (form.usoGlp1)
      alertas.push({
        titulo: "Uso de agonista de GLP-1",
        mensagem: "Risco de esvaziamento gástrico retardado mesmo com jejum padrão cumprido — considerar jejum estendido para sólidos e/ou indução em sequência rápida conforme avaliação de risco.",
        nivel: "moderado",
      });
    if (form.doencaFalciforme)
      alertas.push({
        titulo: "Doença falciforme / hemoglobinopatia",
        mensagem: "Evitar hipóxia, hipotermia, acidose e desidratação; considerar avaliação hematológica prévia.",
        nivel: "moderado",
      });
    if (form.gestante)
      alertas.push({
        titulo: "Gestante",
        mensagem: "Considerar deslocamento uterino à esquerda no posicionamento e avaliação obstétrica conforme idade gestacional.",
        nivel: "moderado",
      });
    if (form.declinioCognitivo)
      alertas.push({
        titulo: "Declínio cognitivo / demência",
        mensagem: "Maior risco de delirium pós-operatório — priorizar analgesia multimodal e evitar benzodiazepínicos quando possível.",
        nivel: "moderado",
      });
    if (form.parkinson)
      alertas.push({
        titulo: "Doença de Parkinson",
        mensagem: "Manter medicações antiparkinsonianas o mais próximo possível do horário habitual; evitar antieméticos antagonistas de dopamina (ex: metoclopramida).",
        nivel: "moderado",
      });
    if (form.exacerbacaoRecente)
      alertas.push({
        titulo: "Exacerbação respiratória recente",
        mensagem: "Avaliar otimização do quadro pulmonar antes de cirurgia eletiva.",
        nivel: "moderado",
      });
    if (form.usoCpapBipap)
      alertas.push({
        titulo: "Uso domiciliar de CPAP/BiPAP",

    const hospitalLabel = HOSPITAIS.find((h) => h.value === form.hospital)?.label || "";

      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Avaliacao Pre-Anestesica//PT-BR",
      "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      `UID:${Date.now()}@avaliacao-pre-anestesica`,
      `DTSTAMP:${fmtICS(new Date())}`,
      `DTSTART:${fmtICS(start)}`,
      `DTEND:${fmtICS(end)}`,
      `SUMMARY:${titulo}`,
      hospitalLabel && `LOCATION:${hospitalLabel}`,
      descricaoPartes.length && `DESCRIPTION:${descricaoPartes.join(" | ")}`,
      "END:VEVENT",
      "END:VCALENDAR",
    ].filter(Boolean);

      type: "text/calendar;charset=utf-8",

            <Toggle
              label="Já teve barriga inchada por líquido, confusão mental ou pele/olhos amarelados por problema no fígado?"
              value={form.childPughSinais}
              onChange={set("childPughSinais")}
            />
          </Section>
        </>
      )}

      {step === 4 && (
        <>
          <Section title="Comorbidades endocrinológicas">
            <SelField
              label="Diabetes mellitus"
              value={form.dmTipo}
              onChange={set("dmTipo")}
              options={[
                { value: "nao", label: "Não possui" },
                { value: "tipo1", label: "Tipo 1" },
                { value: "tipo2", label: "Tipo 2" },
              ]}
            />
            <SelField
              label="Controle glicêmico"
              value={form.controleGlicemico}
              onChange={set("controleGlicemico")}
              options={[
                { value: "bom", label: "Bom" },
                { value: "regular", label: "Regular" },
                { value: "ruim", label: "Ruim" },
              ]}
            />
            <Toggle
              label="Problema de tireoide"
              value={form.tireoidopatia}
              onChange={set("tireoidopatia")}
            />
            <Toggle
              label="Uso de agonista de GLP-1 (semaglutida, liraglutida, tirzepatida etc.)"
              value={form.usoGlp1}
              onChange={set("usoGlp1")}
              hint="Risco de esvaziamento gástrico retardado"
            />
          </Section>
          <Section title="Comorbidades hematológicas">
            <NumField label="Hemoglobina" value={form.hb} onChange={set("hb")} suffix="g/dL" />
            <Toggle
              label="Alguma doença que faz você sangrar fácil ou demorar para estancar o sangramento?"
              value={form.coagulopatia}
              onChange={set("coagulopatia")}
            />
            <Toggle
              label="Doença falciforme ou outra hemoglobinopatia"
              value={form.doencaFalciforme}
              onChange={set("doencaFalciforme")}
            />
            <Toggle
              label="Uso de anticoagulante"
              value={form.anticoagulante}
              onChange={set("anticoagulante")}
            />
            {form.anticoagulante && (
              <>
                <DateField
                  label="Data da última dose do anticoagulante"
                  value={form.dataUltimaDoseAnticoagulante}
                  onChange={set("dataUltimaDoseAnticoagulante")}
                />
                <TimeField
                  label="Horário da última dose"
                  value={form.horarioUltimaDoseAnticoagulante}
                  onChange={set("horarioUltimaDoseAnticoagulante")}
                  hint="Usado para estimar a janela segura para bloqueio neuroaxial — confirmar com o protocolo específico do anticoagulante em uso"
                />
              </>
            )}
          </Section>
        </>
      )}

      {step === 5 && (
        <>
          <Section title="Comorbidades neurológicas">
            <Toggle
              label="Outra doença neurológica (do cérebro ou nervos)"
              value={form.neuroDoenca}
              onChange={set("neuroDoenca")}
            />
            <Toggle label="Epilepsia (convulsões)" value={form.epilepsia} onChange={set("epilepsia")} />
            <Toggle
              label="Doença que afeta os músculos e nervos (doença neuromuscular)"
              value={form.doencaNeuromuscular}
              onChange={set("doencaNeuromuscular")}
            />
            <Toggle
              label="Doença de Parkinson"
              value={form.parkinson}
              onChange={set("parkinson")}
            />
            <Toggle
              label="Miastenia gravis"
              value={form.miasteniaGravis}
              onChange={set("miasteniaGravis")}
            />
            <Toggle
              label="Declínio cognitivo ou demência"
              value={form.declinioCognitivo}
              onChange={set("declinioCognitivo")}
            />
          </Section>
          <Section title="Comorbidades osteomusculares">
            <Toggle
              label="Mobilidade reduzida"
              value={form.mobilidadeReduzida}
              onChange={set("mobilidadeReduzida")}
            />
            <Toggle
              label="Doença de coluna (relevante p/ bloqueio)"
              value={form.doencaColuna}
              onChange={set("doencaColuna")}
            />
          </Section>
        </>
      )}

      {step === 6 && (
        <>
          <Section title="Alergias">
            <Toggle
              label="Alergia medicamentosa"
              value={form.alergiaMedicamentosa}
              onChange={set("alergiaMedicamentosa")}
            />
            {form.alergiaMedicamentosa && (
              <TextField
                label="Quais medicamentos"
                value={form.quaisAlergiasMedicamentosas}
                onChange={set("quaisAlergiasMedicamentosas")}
                placeholder="Ex: Dipirona, Penicilina..."
              />
            )}
            <Toggle
              label="Alergia a látex"
              value={form.alergiaLatex}
              onChange={set("alergiaLatex")}
            />
            <Toggle
              label="Alergia a contraste iodado"
              value={form.alergiaContraste}
              onChange={set("alergiaContraste")}
            />
          </Section>
          <Section title="Hábitos de vida">
            <NumField
              label="Tabagismo (carga)"
              value={form.tabagismoAnos}
              onChange={set("tabagismoAnos")}
              suffix="anos-maço"
              hint="Deixe em branco se não fumante"
            />
            <Toggle label="Etilismo" value={form.etilismo} onChange={set("etilismo")} />
            <Toggle label="Uso de outras drogas" value={form.drogas} onChange={set("drogas")} />
          </Section>
          <Section title="Passado cirúrgico e anestésico">
            <Toggle
              label="Cirurgias prévias"
              value={form.cirurgiasPrevias}
              onChange={set("cirurgiasPrevias")}
            />
            <Toggle
              label="Já teve algum problema ou complicação numa anestesia anterior?"
              value={form.intercorrenciaAnestesica}
              onChange={set("intercorrenciaAnestesica")}
            />
            <Toggle
              label="Já teve náusea/vômito depois de uma cirurgia, ou enjoo fácil em viagens (carro, barco, avião)?"
              value={form.historicoNveoCinetose}
              onChange={set("historicoNveoCinetose")}
            />
            <Toggle
              label="Uso previsto de opioides no pós-operatório"
              value={form.opioidePosOp}
              onChange={set("opioidePosOp")}
              hint="Se não souber, pode deixar em branco — o anestesiologista avalia na consulta"
            />
            <Toggle
              label="Algum parente de sangue já teve febre muito alta ou reação grave durante uma anestesia (hipertermia maligna)?"
              value={form.historiaFamiliarHM}
              onChange={set("historiaFamiliarHM")}
            />
          </Section>
          <Section title="Medicações de uso contínuo">
            <TextAreaField
              label="Medicações em uso"
              value={form.medicacoesUso}
              onChange={set("medicacoesUso")}
              placeholder="Ex: Losartana 50mg 1x/dia, Metformina 850mg 2x/dia, AAS 100mg 1x/dia..."
              hint="Uma por linha, com dose e posologia se possível"
            />
          </Section>
        </>
      )}

      {step === 7 && (
        <>
          {(form.nomePaciente || form.hospital || form.dataCirurgia || form.convenio) && (
            <div className="patient-header">
              {form.nomePaciente && <div className="patient-name">{form.nomePaciente}</div>}
              {form.nomeCirurgiao && (
                <div className="patient-meta">Cirurgião: {form.nomeCirurgiao}</div>
              )}
              <div className="patient-meta">
                {form.hospital &&
                  HOSPITAIS.find((h) => h.value === form.hospital)?.label}
                {form.hospital && form.convenio && " · "}
                {form.convenio}
                {(form.hospital || form.convenio) && form.dataCirurgia && " · "}
                {form.dataCirurgia &&
                  `${form.dataCirurgia.split("-").reverse().join("/")}${
                    form.horarioCirurgia ? " às " + form.horarioCirurgia : ""
                  }`}
              </div>
              {form.dataCirurgia && (
                <button className="btn-calendar" onClick={adicionarAoCalendario}>
                  Adicionar ao calendário
                </button>
              )}
              {form.hospital && (
                <>
                  <button
                    className="btn-calendar"
                    style={{ marginLeft: 8 }}
                    onClick={solicitarGuiaPorEmail}
                  >
                    Solicitar guia por e-mail
                  </button>
                  {!EMAIL_GUIA_POR_HOSPITAL[form.hospital] && (
                    <div className="hint" style={{ marginTop: 8 }}>
                      E-mail deste hospital ainda não cadastrado — o rascunho
                      abrirá sem destinatário, é só preencher manualmente.
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          <p className="result-header">
            Estimativas baseadas nos dados informados. Revise sempre com o
            quadro clínico completo.
          </p>

          {!podeCalcular && (
            <div className="warn-note">
              Idade, sexo, peso e altura são necessários para calcular todos
              os escores. Volte e complete a etapa "Paciente e cirurgia".
            </div>
          )}

          {bmi !== null && (
            <ScoreCard
              nome="IMC"
              valor={`${bmi.toFixed(1)} kg/m²`}
              detalhe={bmiClass}
              nivel={bmi >= 30 || bmi < 18.5 ? (bmi >= 40 ? "alto" : "moderado") : "baixo"}
            />
          )}

          {form.nyha && (
            <ScoreCard
              nome="Classe funcional (NYHA)"
              valor={`NYHA ${form.nyha}`}
              detalhe="Classificação atribuída manualmente"
              nivel={
                form.nyha === "1" || form.nyha === "2"
                  ? "baixo"
                  : form.nyha === "3"
                  ? "moderado"
                  : "alto"
              }
            />
          )}

          <ScoreCard
            nome="RCRI — Índice de Risco Cardíaco Revisado (Lee)"
            valor={`${rcri.pts} ponto(s) — Classe ${rcri.classe}`}
            detalhe={`Risco estimado de evento cardíaco maior em 30 dias: ${rcri.riscoPct}`}
            nivel={rcri.nivel}
            base="Fatores: cirurgia de alto risco, DAC, ICC, doença cerebrovascular, DM insulino-dependente, creatinina >2,0 mg/dL"
          />

          <ScoreCard
            nome="STOP-BANG — Risco de apneia obstrutiva do sono"
            valor={`${stopBang.pts} de 8 pontos`}
            detalhe={stopBang.label}
            nivel={stopBang.nivel}
          />

          <ScoreCard
            nome="ARISCAT — Complicações pulmonares pós-operatórias"
            valor={`${ariscat.pts} pontos`}
            detalhe={`Risco estimado: ${ariscat.riscoPct}`}
            nivel={ariscat.nivel}
          />

          <ScoreCard
            nome="Apfel — Risco de náusea/vômito pós-operatório"
            valor={`${apfel.pts} de 4 pontos`}
            detalhe={`Risco estimado: ${apfel.riscoPct}`}
            nivel={apfel.nivel}
            base="Fatores: sexo feminino, não fumante, histórico de NVPO/cinetose, uso previsto de opioides no pós-operatório"
          />

          {alertasClinicos.length > 0 && (
            <div className="section-card">
              <h3>Alertas clínicos adicionais</h3>
              {alertasClinicos.map((a, i) => (
                <div
                  key={i}
                  className={
                    a.nivel === "alto"
                      ? "airway-alert"
                      : a.nivel === "moderado"
                      ? "warn-note"
                      : "info-note"
                  }
                  style={{ marginBottom: i === alertasClinicos.length - 1 ? 0 : 10 }}
                >
                  <strong>{a.titulo}:</strong> {a.mensagem}
                </div>
              ))}
            </div>
          )}

          {(form.medicacoesUso || "").trim() && (
            <div className="section-card">
              <h3>Medicações de uso contínuo informadas</h3>
              <div className="med-list">
                {form.medicacoesUso.split("\n").filter((l) => l.trim()).map((l, i) => (
                  <div key={i} className="med-item">{l.trim()}</div>
                ))}
              </div>
            </div>
          )}

          <div className="section-card">
            <h3>Orientações pré-operatórias</h3>

            <div className="orient-block">
              <div className="orient-title">Jejum pré-operatório</div>
              <ul>
                <li>Líquidos claros (água, chá claro, sucos sem polpa): até 2h antes</li>
                <li>Leite materno: até 4h antes</li>
                <li>Refeição leve / leite não humano / fórmula infantil: até 6h antes</li>
                <li>Refeição gordurosa ou carne: até 8h antes</li>
              </ul>
              <div className="hint">Ajustar conforme protocolo institucional e condição clínica (ex: diabetes, gestação, obesidade, refluxo).</div>
            </div>

            {form.usoGlp1 && (
              <div className="orient-block">
                <div className="orient-title">Uso de agonista de GLP-1</div>
                <ul>
                  <li>Risco aumentado de conteúdo gástrico residual mesmo com jejum padrão cumprido</li>
                  <li>Considerar jejum estendido para sólidos (ex: dieta líquida nas 24h anteriores) conforme protocolo institucional</li>
                  <li>Considerar indução em sequência rápida ou ultrassonografia gástrica à beira-leito se houver dúvida sobre esvaziamento</li>
                </ul>
              </div>
            )}

            {form.tabagismoAtual && (
              <div className="orient-block">
                <div className="orient-title">Cessação do tabagismo</div>
                <ul>
                  <li>Orientar cessação o quanto antes — idealmente 4 a 8 semanas antes da cirurgia, quando o tempo permitir</li>
                  <li>Mesmo a cessação de 12 a 24h antes reduz carboxihemoglobina e já traz algum benefício</li>
                </ul>
              </div>
            )}

            {form.etilismo && (
              <div className="orient-block">
                <div className="orient-title">Cessação/redução do etilismo</div>
                <ul>
                  <li>Orientar suspensão do álcool antes da cirurgia</li>
                  <li>Atenção ao risco de síndrome de abstinência alcoólica no perioperatório em uso pesado/crônico — considerar avaliação e profilaxia conforme o caso</li>
                </ul>
              </div>
            )}

            <div className="orient-block">
              <div className="orient-title">Higiene oral e corpórea</div>
              <ul>
                <li>Banho antes da cirurgia (com clorexidina degermante, se protocolo do serviço)</li>
                <li>Escovação dentária; remoção de prótese dentária removível no dia do procedimento</li>
                <li>Remover esmalte, maquiagem, joias e adornos</li>
              </ul>
            </div>

            <div className="orient-block">
              <div className="orient-title">Medicações de uso contínuo</div>
              {(form.medicacoesUso || "").trim() ? (
                <div className="hint" style={{ marginBottom: 8 }}>
                  Revisar individualmente cada medicação listada. Pontos de atenção comuns:
                </div>
              ) : (
                <div className="hint" style={{ marginBottom: 8 }}>
                  Nenhuma medicação foi informada. Se houver, preencha o campo na etapa anterior para revisão individualizada.
                </div>
              )}
              <ul>
                <li>Anti-hipertensivos: geralmente mantidos; avaliar suspensão de IECA/BRA no dia da cirurgia conforme protocolo e risco de hipotensão</li>
                <li>Hipoglicemiantes orais: geralmente suspensos no dia; atenção especial à metformina conforme função renal</li>
                <li>Anticoagulantes/antiagregantes: exigem plano individualizado de suspensão/ponte conforme o risco trombótico e o tipo de cirurgia</li>
                <li>Medicações de uso crônico do SNC (ex: antiepilépticos, antidepressivos): geralmente mantidas até o dia da cirurgia</li>
              </ul>
              <div className="hint">Estas são orientações gerais — a decisão final é sempre individualizada.</div>
            </div>
          </div>

          <div className="nav-row">
            <button className="btn-secondary" onClick={reset}>
              Nova avaliação
            </button>
          </div>
        </>
      )}

      {step < STEPS.length - 1 && (
        <div className="nav-row">
          {step > 0 && (
            <button className="btn-secondary" onClick={back}>
              Voltar
            </button>
          )}
          <button className="btn-primary" onClick={next}>
            {step === STEPS.length - 2 ? "Ver escores" : "Avançar"}
          </button>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
