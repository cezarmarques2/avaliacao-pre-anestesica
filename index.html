const storage = {
  async get(key) {
    const v = localStorage.getItem(key);

  async set(key, value) {
    localStorage.setItem(key, value);

function Toggle({ label, value, onChange, hint }) {
  return (
    <div className="field">
      <div className="toggle-row">
        <div>
          <label>{label}</label>
          {hint && <div className="hint">{hint}</div>}
        </div>
        <div className="toggle-btns">
          <button
            type="button"
            className={`toggle-btn ${value === true ? "active" : ""}`}
            onClick={() => onChange(true)}
          >
            Sim
          </button>
          <button
            type="button"
            className={`toggle-btn ${value === false ? "active" : ""}`}
            onClick={() => onChange(false)}
          >
            Não
          </button>
        </div>
      </div>
    </div>
  );
}

function NumField({ label, value, onChange, placeholder, suffix, hint }) {
  return (
    <div className="field">
      <label>{label}</label>
      {hint && <div className="hint">{hint}</div>}
      <div className="input-suffix-wrap">
        <input
          type="number"
          inputMode="decimal"
          value={value}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
        />
        {suffix && <span className="suffix">{suffix}</span>}
      </div>
    </div>
  );
}

function TextField({ label, value, onChange, placeholder, hint, onBlur, listId, listOptions }) {

    <div className="field">

      <input
        type="text"
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        onBlur={onBlur}
        list={listId}
        autoComplete="off"
      />
      {listId && listOptions && (
        <datalist id={listId}>
          {listOptions.map((opt) => (
            <option key={opt} value={opt} />
          ))}
        </datalist>
      )}
    </div>
  );
}

function Section({ title, children }) {

}

function riskBand(level) {
  if (level === "baixo") return { cls: "low", label: "Risco baixo" };
  if (level === "moderado") return { cls: "mid", label: "Risco moderado" };
  return { cls: "high", label: "Risco alto" };
}

function ScoreCard({ nome, valor, detalhe, nivel, base }) {
  const band = riskBand(nivel);
  return (
    <div className={`score-card ${band.cls}`}>
      <div className="score-top">
        <span className="score-nome">{nome}</span>
        <span className={`score-pill ${band.cls}`}>{band.label}</span>
      </div>
      <div className="score-valor">{valor}</div>
      <div className="score-detalhe">{detalhe}</div>
      {base && <div className="score-base">{base}</div>}
    </div>
  );
}

function formatSimNao(v) {
  return v === true ? "Sim" : v === false ? "Não" : "Não informado";
}

function formatValor(v, suffix) {
  if (v === "" || v === null || v === undefined) return "Não informado";
  return suffix ? `${v} ${suffix}` : String(v);
}

function formatData(dataISO) {
  return dataISO ? dataISO.split("-").reverse().join("/") : "Não informado";
}

// Monta o relatório em PDF com todas as respostas do questionário e os
// escores calculados, para envio ao médico responsável.
function gerarRelatorioPDF({ form, bmi, bmiClass, rcri, stopBang, ariscat, apfel, alertasClinicos }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const marginX = 40;
  const pageHeight = doc.internal.pageSize.getHeight();
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 50;

  const ensureSpace = (needed) => {
    if (y + needed > pageHeight - 40) {
      doc.addPage();
      y = 50;
    }
  };

  const addTitle = (text) => {
    y += 6;
    ensureSpace(24);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text(text, marginX, y);
    y += 16;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
  };

  const addLine = (text) => {
    const lines = doc.splitTextToSize(text, pageWidth - marginX * 2);
    lines.forEach((line) => {
      ensureSpace(14);
      doc.text(line, marginX, y);
      y += 14;
    });
  };

  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text("Relatório de Avaliação Pré-Anestésica", marginX, y);
  y += 22;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(`Gerado em ${new Date().toLocaleString("pt-BR")}`, marginX, y);
  y += 18;

  const hospitalLabel = HOSPITAIS.find((h) => h.value === form.hospital)?.label || "Não informado";
  const especialidadeLabel =
    ESPECIALIDADES.find((e) => e.value === form.tipoIncisao)?.label || "Não informado";

  addTitle("Dados do paciente e cirurgia");
  addLine(`Nome: ${formatValor(form.nomePaciente)}`);
  addLine(`Registro: ${formatValor(form.registroPaciente)}`);
  addLine(`Cirurgião: ${formatValor(form.nomeCirurgiao)}`);
  addLine(`Hospital: ${hospitalLabel}`);
  addLine(`Convênio: ${formatValor(form.convenio)}`);
  addLine(`Data/Horário: ${formatData(form.dataCirurgia)}${form.horarioCirurgia ? " às " + form.horarioCirurgia : ""}`);
  addLine(`Procedimento: ${formatValor(form.nomeProcedimento)}`);
  addLine(`Especialidade: ${especialidadeLabel}`);
  addLine(`Idade: ${formatValor(form.idade, "anos")}`);
  addLine(
    `Sexo: ${form.sexo === "masculino" ? "Masculino" : form.sexo === "feminino" ? "Feminino" : "Não informado"}`
  );
  if (form.gestante) addLine("Gestante: Sim");
  addLine(`Peso: ${formatValor(form.peso, "kg")}`);
  addLine(`Altura: ${formatValor(form.altura, "cm")}`);
  addLine(`Caráter de urgência: ${formatSimNao(form.urgencia)}`);

  addTitle("Cardiovascular");
  addLine(`Infarto do miocárdio nos últimos 60 dias: ${formatSimNao(form.iamRecente)}`);
  addLine(`Doença arterial coronariana: ${formatSimNao(form.dac)}`);
  addLine(`Insuficiência cardíaca: ${formatSimNao(form.icc)}`);
  addLine(`AVC/AIT prévio: ${formatSimNao(form.avcPrevio)}`);
  addLine(`Hipertensão arterial: ${formatSimNao(form.has)}`);
  addLine(`Arritmia: ${formatSimNao(form.arritmia)}`);
  addLine(`Valvopatia: ${formatSimNao(form.valvopatia)}`);
  addLine(`Diabetes em uso de insulina: ${formatSimNao(form.dmInsulina)}`);
  addLine(`Classe funcional (NYHA): ${form.nyha ? "Classe " + form.nyha : "Não informado"}`);
  addLine(`Marcapasso/CDI: ${formatSimNao(form.marcapassoCdi)}`);
  addLine(`Stent coronariano nos últimos 12 meses: ${formatSimNao(form.stentCoronarianoRecente)}`);
  addLine(`Dupla antiagregação plaquetária (DAPT): ${formatSimNao(form.duplaAntiagregacao)}`);

  addTitle("Pulmonar");
  addLine(`DPOC: ${formatSimNao(form.dpoc)}`);
  addLine(`Asma: ${formatSimNao(form.asma)}`);
  addLine(`Exacerbação/internação respiratória recente: ${formatSimNao(form.exacerbacaoRecente)}`);
  addLine(`Tabagismo atual: ${formatSimNao(form.tabagismoAtual)}`);
  addLine(`SpO2 basal em ar ambiente: ${formatValor(form.spo2, "%")}`);
  addLine(`Infecção respiratória no último mês: ${formatSimNao(form.infeccaoResp)}`);
  addLine(`Ronco alto: ${formatSimNao(form.ronco)}`);
  addLine(`Sonolência diurna excessiva: ${formatSimNao(form.sonolencia)}`);
  addLine(`Apneia observada por terceiros: ${formatSimNao(form.apneiaObservada)}`);
  addLine(`Uso domiciliar de CPAP/BiPAP: ${formatSimNao(form.usoCpapBipap)}`);

  addTitle("Renal e hepático");
  addLine(`Doença renal crônica: ${formatSimNao(form.drc)}`);
  addLine(`Diálise: ${formatSimNao(form.dialise)}`);
  addLine(`Creatinina sérica: ${formatValor(form.creatinina, "mg/dL")}`);
  addLine(`Doença hepática (hepatite crônica/cirrose): ${formatSimNao(form.hepatopatia)}`);
  addLine(`Sinais de descompensação hepática: ${formatSimNao(form.childPughSinais)}`);

  addTitle("Endócrino e hematológico");
  addLine(
    `Diabetes mellitus: ${
      form.dmTipo === "tipo1"
        ? "Tipo 1"
        : form.dmTipo === "tipo2"
        ? "Tipo 2"
        : form.dmTipo === "nao"
        ? "Não possui"
        : "Não informado"
    }`
  );
  addLine(`Controle glicêmico: ${formatValor(form.controleGlicemico)}`);
  addLine(`Problema de tireoide: ${formatSimNao(form.tireoidopatia)}`);
  addLine(`Uso de agonista de GLP-1: ${formatSimNao(form.usoGlp1)}`);
  addLine(`Hemoglobina: ${formatValor(form.hb, "g/dL")}`);
  addLine(`Coagulopatia conhecida: ${formatSimNao(form.coagulopatia)}`);
  addLine(`Doença falciforme/hemoglobinopatia: ${formatSimNao(form.doencaFalciforme)}`);
  addLine(`Uso de anticoagulante: ${formatSimNao(form.anticoagulante)}`);
  if (form.anticoagulante) {
    addLine(
      `Última dose do anticoagulante: ${formatData(form.dataUltimaDoseAnticoagulante)}${
        form.horarioUltimaDoseAnticoagulante ? " às " + form.horarioUltimaDoseAnticoagulante : ""
      }`
    );
  }

  addTitle("Neurológico e osteomuscular");
  addLine(`Doença neurológica prévia: ${formatSimNao(form.neuroDoenca)}`);
  addLine(`Epilepsia: ${formatSimNao(form.epilepsia)}`);

  addLine(`Mobilidade reduzida: ${formatSimNao(form.mobilidadeReduzida)}`);
  addLine(`Doença de coluna: ${formatSimNao(form.doencaColuna)}`);

  addTitle("Alergias");
  addLine(
    `Alergia medicamentosa: ${formatSimNao(form.alergiaMedicamentosa)}${
      form.alergiaMedicamentosa && form.quaisAlergiasMedicamentosas
        ? " (" + form.quaisAlergiasMedicamentosas + ")"
        : ""
    }`
  );
  addLine(`Alergia a látex: ${formatSimNao(form.alergiaLatex)}`);
  addLine(`Alergia a contraste iodado: ${formatSimNao(form.alergiaContraste)}`);

  addTitle("Hábitos e passado cirúrgico/anestésico");
  addLine(`Tabagismo (carga): ${formatValor(form.tabagismoAnos, "anos-maço")}`);
  addLine(`Etilismo: ${formatSimNao(form.etilismo)}`);
  addLine(`Uso de outras drogas: ${formatSimNao(form.drogas)}`);
  addLine(`Cirurgias prévias: ${formatSimNao(form.cirurgiasPrevias)}`);
  addLine(`Intercorrência anestésica prévia: ${formatSimNao(form.intercorrenciaAnestesica)}`);
  addLine(`Histórico de NVPO/cinetose: ${formatSimNao(form.historicoNveoCinetose)}`);
  addLine(`Uso previsto de opioides no pós-operatório: ${formatSimNao(form.opioidePosOp)}`);
  addLine(`História familiar de hipertermia maligna: ${formatSimNao(form.historiaFamiliarHM)}`);

  if ((form.medicacoesUso || "").trim()) {
    addTitle("Medicações de uso contínuo");
    form.medicacoesUso
      .split("\n")
      .filter((l) => l.trim())
      .forEach((l) => addLine("• " + l.trim()));
  }

  addTitle("Índices e escores de risco");
  if (bmi !== null) addLine(`IMC: ${bmi.toFixed(1)} kg/m² (${bmiClass})`);
  addLine(
    `RCRI (Lee) — Índice de Risco Cardíaco Revisado: ${rcri.pts} ponto(s), Classe ${rcri.classe}, risco estimado ${rcri.riscoPct}`
  );
  addLine(`STOP-BANG — Risco de apneia obstrutiva do sono: ${stopBang.pts} de 8 pontos (${stopBang.label})`);
  addLine(
    `ARISCAT — Complicações pulmonares pós-operatórias: ${ariscat.pts} pontos, risco estimado ${ariscat.riscoPct}`
  );
  addLine(
    `Apfel — Risco de náusea/vômito pós-operatório: ${apfel.pts} de 4 pontos, risco estimado ${apfel.riscoPct}`
  );

  if (alertasClinicos.length > 0) {
    addTitle("Alertas clínicos");
    alertasClinicos.forEach((a) => addLine(`[${a.nivel.toUpperCase()}] ${a.titulo}: ${a.mensagem}`));
  }

  return doc;
}

function App() {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(initialForm);
  const [cirurgioesHistorico, setCirurgioesHistorico] = useState([]);
  const [respostasEnviadas, setRespostasEnviadas] = useState(false);

  const CIRURGIOES_KEY = "cirurgioes-historico";

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(CIRURGIOES_KEY);
        setCirurgioesHistorico(res ? JSON.parse(res.value) : []);
      } catch {
        setCirurgioesHistorico([]);
      }
    })();
  }, []);

  const salvarCirurgiaoNoHistorico = async () => {
    const nome = form.nomeCirurgiao.trim();
    if (!nome || cirurgioesHistorico.includes(nome)) return;
    const atualizado = [...cirurgioesHistorico, nome].sort((a, b) =>
      a.localeCompare(b, "pt-BR")
    );
    setCirurgioesHistorico(atualizado);
    try {
      await storage.set(CIRURGIOES_KEY, JSON.stringify(atualizado));
    } catch {
      // se falhar, o nome ainda fica disponível nesta sessão
    }
  };

  const set = (key) => (val) => setForm((f) => ({ ...f, [key]: val }));

  const num = (v) => (v === "" || v === null || v === undefined ? null : parseFloat(v));

  const idade = num(form.idade);
  const peso = num(form.peso);
  const altura = num(form.altura);
  const spo2 = num(form.spo2);
  const creatinina = num(form.creatinina);
  const hb = num(form.hb);

  const bmi = useMemo(() => {
    if (!peso || !altura) return null;
    const alturaM = altura > 3 ? altura / 100 : altura;
    return peso / (alturaM * alturaM);
  }, [peso, altura]);

  const bmiClass = useMemo(() => {
    if (bmi === null) return "";
    if (bmi < 18.5) return "abaixo do peso";
    if (bmi < 25) return "peso normal";
    if (bmi < 30) return "sobrepeso";
    if (bmi < 35) return "obesidade grau I";
    if (bmi < 40) return "obesidade grau II";
    return "obesidade grau III";
  }, [bmi]);

  const categoriaRisco = CATEGORIA_RISCO[form.tipoIncisao] || "";

  const rcri = useMemo(() => {
    const highRiskSurgery = ["intraperitoneal", "intratoracica", "vascular"].includes(
      categoriaRisco
    );
    let pts = 0;
    if (highRiskSurgery) pts++;
    if (form.dac) pts++;
    if (form.icc) pts++;
    if (form.avcPrevio) pts++;
    if (form.dmInsulina) pts++;
    if (creatinina !== null && creatinina > 2.0) pts++;

    let classe, riscoPct, nivel;
    if (pts === 0) {
      classe = "I";
      riscoPct = "0,4%";
      nivel = "baixo";
    } else if (pts === 1) {
      classe = "II";
      riscoPct = "~0,9%";
      nivel = "baixo";
    } else if (pts === 2) {
      classe = "III";
      riscoPct = "~6,6%";
      nivel = "moderado";
    } else {
      classe = "IV";
      riscoPct = ">=11%";
      nivel = "alto";
    }
    return { pts, classe, riscoPct, nivel };
  }, [categoriaRisco, form.dac, form.icc, form.avcPrevio, form.dmInsulina, creatinina]);

  const stopBang = useMemo(() => {
    let pts = 0;
    if (form.ronco) pts++;
    if (form.sonolencia) pts++;
    if (form.apneiaObservada) pts++;
    if (form.has) pts++;
    if (bmi !== null && bmi > 35) pts++;
    if (idade !== null && idade > 50) pts++;
    if (form.sexo === "masculino") pts++;

    let nivel, label;
    if (pts <= 2) {
      nivel = "baixo";
      label = "baixo risco de AOS";
    } else if (pts <= 4) {
      nivel = "moderado";
      label = "risco intermediário de AOS";
    } else {
      nivel = "alto";
      label = "alto risco de AOS";
    }
    return { pts, nivel, label };
  }, [form.ronco, form.sonolencia, form.apneiaObservada, form.has, bmi, idade, form.sexo]);

  const ariscat = useMemo(() => {
    let pts = 0;
    if (idade !== null) {
      if (idade > 80) pts += 16;
      else if (idade >= 51) pts += 3;
    }
    if (spo2 !== null) {
      if (spo2 <= 90) pts += 24;
      else if (spo2 <= 95) pts += 8;
    }
    if (form.infeccaoResp) pts += 17;
    if (hb !== null && hb <= 10) pts += 11;
    if (categoriaRisco === "intratoracica") pts += 24;
    else if (categoriaRisco === "intraperitoneal") pts += 15;
    if (form.urgencia) pts += 8;

    let nivel, riscoPct;
    if (pts < 26) {
      nivel = "baixo";
      riscoPct = "~1,6%";
    } else if (pts < 45) {
      nivel = "moderado";
      riscoPct = "~13,3%";
    } else {
      nivel = "alto";
      riscoPct = "~42%";
    }
    return { pts, nivel, riscoPct };
  }, [idade, spo2, form.infeccaoResp, hb, categoriaRisco, form.urgencia]);

  const apfel = useMemo(() => {
    let pts = 0;
    if (form.sexo === "feminino") pts++;
    if (!form.tabagismoAtual) pts++;
    if (form.historicoNveoCinetose) pts++;
    if (form.opioidePosOp) pts++;

    const riscoPorPontos = { 0: "~10%", 1: "~21%", 2: "~39%", 3: "~61%", 4: "~79%" };
    let nivel;
    if (pts <= 1) nivel = "baixo";
    else if (pts === 2) nivel = "moderado";
    else nivel = "alto";

    return { pts, nivel, riscoPct: riscoPorPontos[pts] };
  }, [form.sexo, form.tabagismoAtual, form.historicoNveoCinetose, form.opioidePosOp]);

  const alertasClinicos = useMemo(() => {
    const alertas = [];
    if (form.alergiaMedicamentosa)
      alertas.push({
        titulo: "Alergia medicamentosa",
        mensagem: form.quaisAlergiasMedicamentosas
          ? `Medicamentos relatados: ${form.quaisAlergiasMedicamentosas}.`
          : "Confirmar detalhes com o paciente antes da indução.",
        nivel: "alto",
      });
    if (form.alergiaLatex)
      alertas.push({
        titulo: "Alergia a látex",
        mensagem: "Providenciar sala e material livres de látex.",
        nivel: "alto",
      });
    if (form.alergiaContraste)
      alertas.push({
        titulo: "Alergia a contraste iodado",
        mensagem: "Atenção se houver uso de contraste no procedimento; considerar pré-medicação conforme protocolo.",
        nivel: "alto",
      });
    if (form.iamRecente)
      alertas.push({
        titulo: "IAM recente (<60 dias)",
        mensagem: "Considerar adiar cirurgia eletiva e discutir otimização com a cardiologia antes de prosseguir.",
        nivel: "alto",
      });
    if (form.miasteniaGravis)
      alertas.push({
        titulo: "Miastenia gravis",
        mensagem: "Sensibilidade aumentada a bloqueadores neuromusculares não despolarizantes — ajustar dose e monitorização.",
        nivel: "alto",
      });
    if (form.stentCoronarianoRecente && form.duplaAntiagregacao) {
      alertas.push({
        titulo: "Stent coronariano recente + dupla antiagregação",
        mensagem: "Avaliar risco de trombose de stent vs. sangramento com a cardiologia antes de suspender antiagregantes.",
        nivel: "alto",
      });
    } else if (form.stentCoronarianoRecente) {
      alertas.push({
        titulo: "Stent coronariano recente",
        mensagem: "Confirmar tempo desde o implante e esquema atual de antiagregantes.",
        nivel: "moderado",
      });
    }
    if (form.marcapassoCdi)
      alertas.push({
        titulo: "Marcapasso / CDI",
        mensagem: "Verificar necessidade de reprogramação/ímã e interrogação do dispositivo antes e depois do uso de eletrocautério.",
        nivel: "moderado",
      });
    if (form.usoGlp1)
      alertas.push({
        titulo: "Uso de agonista de GLP-1",
        mensagem: "Risco de esvaziamento gástrico retardado mesmo com jejum padrão cumprido — considerar jejum estendido para sólidos e/ou indução em sequência rápida conforme avaliação de risco.",
        nivel: "moderado",
      });
    if (form.doencaFalciforme)
      alertas.push({
        titulo: "Doença falciforme / hemoglobinopatia",
        mensagem: "Evitar hipóxia, hipotermia, acidose e desidratação; considerar avaliação hematológica prévia.",
        nivel: "moderado",
      });
    if (form.gestante)
      alertas.push({
        titulo: "Gestante",
        mensagem: "Considerar deslocamento uterino à esquerda no posicionamento e avaliação obstétrica conforme idade gestacional.",
        nivel: "moderado",
      });
    if (form.declinioCognitivo)
      alertas.push({
        titulo: "Declínio cognitivo / demência",
        mensagem: "Maior risco de delirium pós-operatório — priorizar analgesia multimodal e evitar benzodiazepínicos quando possível.",
        nivel: "moderado",
      });
    if (form.parkinson)
      alertas.push({
        titulo: "Doença de Parkinson",
        mensagem: "Manter medicações antiparkinsonianas o mais próximo possível do horário habitual; evitar antieméticos antagonistas de dopamina (ex: metoclopramida).",
        nivel: "moderado",
      });
    if (form.exacerbacaoRecente)
      alertas.push({
        titulo: "Exacerbação respiratória recente",
        mensagem: "Avaliar otimização do quadro pulmonar antes de cirurgia eletiva.",
        nivel: "moderado",
      });
    if (form.usoCpapBipap)
      alertas.push({
        titulo: "Uso domiciliar de CPAP/BiPAP",
        mensagem: "Orientar o paciente a trazer o dispositivo para uso no pós-operatório.",
        nivel: "baixo",
      });
    if (form.anticoagulante && (form.dataUltimaDoseAnticoagulante || form.horarioUltimaDoseAnticoagulante)) {
      const dataFmt = form.dataUltimaDoseAnticoagulante
        ? form.dataUltimaDoseAnticoagulante.split("-").reverse().join("/")
        : "";
      alertas.push({
        titulo: "Última dose de anticoagulante",
        mensagem: `${dataFmt}${
          form.horarioUltimaDoseAnticoagulante ? " às " + form.horarioUltimaDoseAnticoagulante : ""
        } — confirmar janela segura para bloqueio neuroaxial conforme o anticoagulante específico em uso.`,
        nivel: "baixo",
      });
    }
    return alertas;
  }, [
    form.alergiaMedicamentosa,
    form.quaisAlergiasMedicamentosas,
    form.alergiaLatex,
    form.alergiaContraste,
    form.iamRecente,
    form.miasteniaGravis,
    form.stentCoronarianoRecente,
    form.duplaAntiagregacao,
    form.marcapassoCdi,
    form.usoGlp1,
    form.doencaFalciforme,
    form.gestante,
    form.declinioCognitivo,
    form.parkinson,
    form.exacerbacaoRecente,
    form.usoCpapBipap,
    form.anticoagulante,
    form.dataUltimaDoseAnticoagulante,
    form.horarioUltimaDoseAnticoagulante,
  ]);

  const next = () => setStep((s) => Math.min(s + 1, STEPS.length - 1));
  const back = () => setStep((s) => Math.max(s - 1, 0));
  const reset = () => {
    setForm(initialForm);
    setStep(0);
    setRespostasEnviadas(false);
  };

  const pad2 = (n) => String(n).padStart(2, "0");
  const fmtICS = (dt) =>
    `${dt.getFullYear()}${pad2(dt.getMonth() + 1)}${pad2(dt.getDate())}T${pad2(
      dt.getHours()
    )}${pad2(dt.getMinutes())}00`;

  const adicionarAoCalendario = () => {
    if (!form.dataCirurgia) return;
    const [y, m, d] = form.dataCirurgia.split("-").map(Number);
    const [hh, mm] = (form.horarioCirurgia || "07:00").split(":").map(Number);
    const start = new Date(y, m - 1, d, hh, mm);
    const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);

    const titulo = form.nomePaciente || "Avaliação pré-anestésica";
    const hospitalLabel = HOSPITAIS.find((h) => h.value === form.hospital)?.label || "";
    const descricaoPartes = [];
    if (form.convenio) descricaoPartes.push(`Convênio: ${form.convenio}`);
    if (form.tipoIncisao)
      descricaoPartes.push(
        `Especialidade: ${ESPECIALIDADES.find((e) => e.value === form.tipoIncisao)?.label || ""}`
      );

    const linhas = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Avaliacao Pre-Anestesica//PT-BR",
      "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      `UID:${Date.now()}@avaliacao-pre-anestesica`,
      `DTSTAMP:${fmtICS(new Date())}`,
      `DTSTART:${fmtICS(start)}`,
      `DTEND:${fmtICS(end)}`,
      `SUMMARY:${titulo}`,
      hospitalLabel && `LOCATION:${hospitalLabel}`,
      descricaoPartes.length && `DESCRIPTION:${descricaoPartes.join(" | ")}`,
      "END:VEVENT",
      "END:VCALENDAR",
    ].filter(Boolean);

    const blob = new Blob([linhas.join("\r\n")], {
      type: "text/calendar;charset=utf-8",
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${titulo.replace(/\s+/g, "_")}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const solicitarGuiaPorEmail = () => {
    const dataHora = form.dataCirurgia
      ? `${form.dataCirurgia.split("-").reverse().join("/")}${
          form.horarioCirurgia ? " às " + form.horarioCirurgia : ""
        }`
      : "";
    const procedimentoLabel =
      form.nomeProcedimento ||
      ESPECIALIDADES.find((e) => e.value === form.tipoIncisao)?.label ||
      "";

    const corpo =
      "Gostaria de solicitar a guia do procedimento cirúrgico do paciente a seguir:\n" +
      `Nome: ${form.nomePaciente || ""}\n` +
      `Convênio: ${form.convenio || ""}\n` +
      `Data e Horário: ${dataHora}\n` +
      `Procedimento: ${procedimentoLabel}\n` +
      `Registro: ${form.registroPaciente || ""}`;

    const assunto = `Solicitação de guia de honorários - ${form.nomePaciente || "paciente"}`;
    const emailConfig = EMAIL_GUIA_POR_HOSPITAL[form.hospital];
    const destinatario =
      typeof emailConfig === "object" && emailConfig !== null
        ? (form.urgencia ? emailConfig.urgencia : emailConfig.eletiva)
        : emailConfig || "";

    const gmailCompose = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(
      destinatario
    )}&su=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    window.open(gmailCompose, "_blank", "noopener");
  };

  const enviarRespostas = () => {
    const doc = gerarRelatorioPDF({ form, bmi, bmiClass, rcri, stopBang, ariscat, apfel, alertasClinicos });
    const nomeArquivoBase = (form.nomePaciente || "paciente")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/\s+/g, "_");
    doc.save(`avaliacao_pre_anestesica_${nomeArquivoBase}.pdf`);

    const hospitalLabel = HOSPITAIS.find((h) => h.value === form.hospital)?.label || "";
    const dataFmt = formatData(form.dataCirurgia);
    const assunto = `Avaliação pré-anestésica - ${form.nomePaciente || "paciente"} - ${
      hospitalLabel || "hospital não informado"
    } - ${dataFmt}`;
    const corpo =
      "Segue avaliação pré-anestésica preenchida pelo paciente.\n\n" +
      "IMPORTANTE: o relatório em PDF foi baixado neste dispositivo — anexe o arquivo antes de enviar este e-mail.\n\n" +
      `Paciente: ${form.nomePaciente || ""}\n` +
      `Hospital: ${hospitalLabel}\n` +
      `Data: ${dataFmt}`;
    const gmailCompose = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(
      "camsf2740@gmail.com"
    )}&su=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    window.open(gmailCompose, "_blank", "noopener");
    setRespostasEnviadas(true);
  };

  return (
    <div className="app">
      <style>{`

          --surface: #FFFFFF;
          --ink: #16232E;
          --muted: #5B6B76;
          --border: #DCE3E7;
          --accent: #2E6F95;
          --accent-soft: #E4EDF2;
          --low: #1F9D6B;
          --low-soft: #E4F5EC;
          --mid: #D98B2B;
          --mid-soft: #FBEBD6;
          --high: #C0392B;
          --high-soft: #FBE3E0;
        }

        * { box-sizing: border-box; }

        .app {
          font-family: 'IBM Plex Sans', sans-serif;
          color: var(--ink);
          background: var(--bg);
          min-height: 100%;
          max-width: 480px;
          margin: 0 auto;
          padding: 18px 16px 90px;
        }

        .top-eyebrow {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 11px;
          letter-spacing: 0.14em;
          color: var(--muted);
          text-transform: uppercase;
          margin: 0 0 6px;
        }

        .top-title {
          font-size: 19px;
          font-weight: 600;
          margin: 0 0 14px;
        }

        .progress-wrap {
          margin-bottom: 18px;
        }

        .progress-track {
          height: 4px;
          background: var(--border);
          border-radius: 4px;
          overflow: hidden;
        }

        .progress-fill {
          height: 100%;
          background: var(--accent);
          transition: width 0.2s ease;
        }

        .progress-label {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 11px;
          color: var(--muted);
          margin-top: 6px;
        }

        .disclaimer {
          font-size: 12px;
          color: var(--muted);
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 10px 12px;
          margin-bottom: 16px;
        }

        .section-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 18px 16px;
          margin-bottom: 14px;
        }

          font-size: 13px;

        .score-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 8px;
        }

        .score-nome {
          font-size: 14px;
          font-weight: 600;
        }

        .score-pill {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 11px;
          font-weight: 500;
          padding: 4px 10px;
          border-radius: 999px;
        }

        .score-pill.low { background: var(--low-soft); color: var(--low); }
        .score-pill.mid { background: var(--mid-soft); color: var(--mid); }
        .score-pill.high { background: var(--high-soft); color: var(--high); }

        .score-valor {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 24px;
          font-weight: 600;
          margin-bottom: 4px;
        }

        .score-detalhe {
          font-size: 13px;
          color: var(--muted);
        }

        .score-base {
          font-size: 11px;
          color: var(--muted);
          margin-top: 8px;
          padding-top: 8px;
          border-top: 1px dashed var(--border);
        }

        .airway-alert {
          background: var(--high-soft);
          color: var(--high);
          border-radius: 10px;
          padding: 12px;
          font-size: 13px;
          margin-bottom: 12px;
        }

        .airway-ok {
          background: var(--low-soft);
          color: var(--low);
          border-radius: 10px;
          padding: 12px;
          font-size: 13px;
          margin-bottom: 12px;
        }

        .info-note {
          background: var(--accent-soft);
          color: var(--accent);
          border-radius: 10px;
          padding: 12px;
          font-size: 13px;
          margin-bottom: 12px;
        }

        .result-header {
          font-size: 12px;
          color: var(--muted);
          margin-bottom: 14px;
        }

        .patient-header {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 14px;
          padding: 14px 16px;
          margin-bottom: 14px;
        }

        .patient-name {
          font-size: 16px;
          font-weight: 600;
        }

        .patient-meta {
          font-size: 13px;
          color: var(--muted);
          margin-top: 2px;
        }

        .btn-calendar {
          margin-top: 10px;
          font-family: 'IBM Plex Sans', sans-serif;
          font-size: 13px;
          font-weight: 600;
          padding: 9px 14px;
          border-radius: 10px;
          border: 1px solid var(--accent);
          background: var(--accent-soft);
          color: var(--accent);
          cursor: pointer;
        }

        .med-list {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .med-item {
          font-size: 14px;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 8px 10px;
        }

        .orient-block {
          margin-bottom: 16px;
        }

        .orient-block:last-child { margin-bottom: 0; }

        .orient-title {
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 6px;
        }

        .orient-block ul {
          margin: 0 0 6px;
          padding-left: 18px;
        }

        .orient-block li {
          font-size: 13px;
          color: var(--ink);
          margin-bottom: 4px;
        }
      `}</style>

      <p className="top-eyebrow">Avaliação pré-anestésica</p>
      <p className="top-title">{STEPS[step]}</p>

      {step < STEPS.length - 1 && (
        <div className="progress-wrap">
          <div className="progress-track">
            <div
              className="progress-fill"
              style={{ width: `${((step + 1) / (STEPS.length - 1)) * 100}%` }}
            />
          </div>
          <div className="progress-label">
            Etapa {step + 1} de {STEPS.length - 1}
          </div>
        </div>
      )}

      {step === 0 && (
        <div className="disclaimer">
          Ferramenta de apoio à decisão clínica. Os escores calculados são
          estimativas baseadas em literatura consolidada e não substituem o
          julgamento clínico. Os dados preenchidos não são salvos — ficam
          apenas nesta sessão e somem ao atualizar a página ou iniciar uma
          nova avaliação.
        </div>
      )}

      {step === 0 && (
        <Section title="Dados do paciente e cirurgia">
          <TextField
            label="Nome"
            value={form.nomePaciente}
            onChange={set("nomePaciente")}
            placeholder="Nome completo"
          />
          <TextField
            label="Registro"
            value={form.registroPaciente}
            onChange={set("registroPaciente")}
            placeholder="Matrícula / número de registro no hospital"
          />
          <TextField
            label="Nome do cirurgião"
            value={form.nomeCirurgiao}
            onChange={set("nomeCirurgiao")}
            onBlur={salvarCirurgiaoNoHistorico}
            listId="lista-cirurgioes"
            listOptions={cirurgioesHistorico}
            placeholder="Nome completo"
            hint={
              cirurgioesHistorico.length > 0
                ? "Comece a digitar para ver nomes já usados antes"
                : undefined
            }
          />
          <SelField
            label="Hospital"
            value={form.hospital}
            onChange={set("hospital")}
            options={HOSPITAIS}
          />
          <DateField
            label="Data"
            value={form.dataCirurgia}
            onChange={set("dataCirurgia")}
          />
          <TimeField
            label="Horário"
            value={form.horarioCirurgia}
            onChange={set("horarioCirurgia")}
          />
          <SelField
            label="Convênio"
            value={form.convenio}
            onChange={set("convenio")}
            options={CONVENIOS}
          />
          <TextField
            label="Nome do procedimento"
            value={form.nomeProcedimento}
            onChange={set("nomeProcedimento")}
            placeholder="Ex: Colecistectomia videolaparoscópica"
          />
          <NumField label="Idade" value={form.idade} onChange={set("idade")} suffix="anos" />
          <SelField
            label="Sexo"
            value={form.sexo}
            onChange={set("sexo")}
            options={[
              { value: "masculino", label: "Masculino" },
              { value: "feminino", label: "Feminino" },
            ]}
          />
          {form.sexo === "feminino" && (
            <Toggle label="Gestante" value={form.gestante} onChange={set("gestante")} />
          )}
          <NumField label="Peso" value={form.peso} onChange={set("peso")} suffix="kg" />
          <NumField label="Altura" value={form.altura} onChange={set("altura")} suffix="cm" />
          <SelField
            label="Especialidade cirúrgica"
            value={form.tipoIncisao}
            onChange={set("tipoIncisao")}
            hint="Usada para classificar automaticamente o porte cirúrgico nos escores de risco"
            options={ESPECIALIDADES}
          />
          {form.tipoIncisao === "cardiaca" && (
            <div className="hint">
              RCRI e ARISCAT foram validados para cirurgia não cardíaca — para
              cirurgia cardíaca, considere ferramentas específicas (ex:
              EuroSCORE II).
            </div>
          )}
          <Toggle label="Caráter de urgência" value={form.urgencia} onChange={set("urgencia")} />
        </Section>
      )}

      {step === 1 && (
        <Section title="Comorbidades cardiovasculares">
          <Toggle
            label="Já teve infarto nos últimos 60 dias?"
            value={form.iamRecente}
            onChange={set("iamRecente")}
          />
          <Toggle
            label="Doença arterial coronariana (entupimento das artérias do coração, já teve infarto ou colocou stent)"
            value={form.dac}
            onChange={set("dac")}
          />
          <Toggle label="Insuficiência cardíaca (coração fraco)" value={form.icc} onChange={set("icc")} />
          <Toggle
            label="AVC / derrame ou isquemia cerebral transitória prévios"
            value={form.avcPrevio}
            onChange={set("avcPrevio")}
          />
          <Toggle label="Hipertensão arterial (pressão alta)" value={form.has} onChange={set("has")} />
          <Toggle
            label="Arritmia (batimento cardíaco irregular)"
            value={form.arritmia}
            onChange={set("arritmia")}
          />
          <Toggle
            label="Problema em válvula do coração (valvopatia)"
            value={form.valvopatia}
            onChange={set("valvopatia")}
          />
          <Toggle
            label="Diabetes em uso de insulina"
            value={form.dmInsulina}
            onChange={set("dmInsulina")}
          />
          <SelField
            label="Classe funcional (NYHA)"
            value={form.nyha}
            onChange={set("nyha")}
            options={[
              { value: "1", label: "Classe I — sem limitação" },
              { value: "2", label: "Classe II — limitação leve" },
              { value: "3", label: "Classe III — limitação acentuada" },
              { value: "4", label: "Classe IV — sintomas em repouso" },
            ]}
          />
          <Toggle
            label="Marcapasso ou cardioversor-desfibrilador implantável (CDI)"
            value={form.marcapassoCdi}
            onChange={set("marcapassoCdi")}
          />
          <Toggle
            label="Stent coronariano nos últimos 12 meses"
            value={form.stentCoronarianoRecente}
            onChange={set("stentCoronarianoRecente")}
          />
          <Toggle
            label="Uso atual de dupla antiagregação plaquetária (DAPT)"
            value={form.duplaAntiagregacao}
            onChange={set("duplaAntiagregacao")}
          />
        </Section>
      )}

      {step === 2 && (
        <Section title="Comorbidades pulmonares">
          <Toggle
            label="DPOC (enfisema ou bronquite crônica)"
            value={form.dpoc}
            onChange={set("dpoc")}
          />
          <Toggle label="Asma" value={form.asma} onChange={set("asma")} />
          <Toggle
            label="Piora recente ou internação por asma/bronquite/enfisema (últimos 12 meses)"
            value={form.exacerbacaoRecente}
            onChange={set("exacerbacaoRecente")}
          />
          <Toggle
            label="Tabagismo atual"
            value={form.tabagismoAtual}
            onChange={set("tabagismoAtual")}
          />
          <NumField
            label="SpO2 basal em ar ambiente"
            value={form.spo2}
            onChange={set("spo2")}
            suffix="%"
          />
          <Toggle
            label="Infecção respiratória no último mês"
            value={form.infeccaoResp}
            onChange={set("infeccaoResp")}
          />
          <Toggle label="Ronco alto" value={form.ronco} onChange={set("ronco")} />
          <Toggle
            label="Sonolência diurna excessiva"
            value={form.sonolencia}
            onChange={set("sonolencia")}
          />
          <Toggle
            label="Apneia observada por terceiros"
            value={form.apneiaObservada}
            onChange={set("apneiaObservada")}
          />
          <Toggle
            label="Uso domiciliar de CPAP/BiPAP"
            value={form.usoCpapBipap}
            onChange={set("usoCpapBipap")}
          />
        </Section>
      )}

      {step === 3 && (
        <>
          <Section title="Comorbidades renais">
            <Toggle
              label="Doença renal crônica (problema nos rins de longo prazo)"
              value={form.drc}
              onChange={set("drc")}
            />
            <Toggle label="Faz diálise" value={form.dialise} onChange={set("dialise")} />
            <NumField
              label="Creatinina sérica"
              value={form.creatinina}
              onChange={set("creatinina")}
              suffix="mg/dL"
              hint="Se souber, do exame de sangue mais recente; deixe em branco se não souber"
            />
          </Section>
          <Section title="Comorbidades hepáticas">
            <Toggle
              label="Doença no fígado (hepatite crônica, cirrose)"
              value={form.hepatopatia}
              onChange={set("hepatopatia")}
            />
            <Toggle
              label="Já teve barriga inchada por líquido, confusão mental ou pele/olhos amarelados por problema no fígado?"
              value={form.childPughSinais}
              onChange={set("childPughSinais")}
            />
          </Section>
        </>
      )}

      {step === 4 && (
        <>
          <Section title="Comorbidades endocrinológicas">
            <SelField
              label="Diabetes mellitus"
              value={form.dmTipo}
              onChange={set("dmTipo")}
              options={[
                { value: "nao", label: "Não possui" },
                { value: "tipo1", label: "Tipo 1" },
                { value: "tipo2", label: "Tipo 2" },
              ]}
            />
            <SelField
              label="Controle glicêmico"
              value={form.controleGlicemico}
              onChange={set("controleGlicemico")}
              options={[
                { value: "bom", label: "Bom" },
                { value: "regular", label: "Regular" },
                { value: "ruim", label: "Ruim" },
              ]}
            />
            <Toggle
              label="Problema de tireoide"
              value={form.tireoidopatia}
              onChange={set("tireoidopatia")}
            />
            <Toggle
              label="Uso de agonista de GLP-1 (semaglutida, liraglutida, tirzepatida etc.)"
              value={form.usoGlp1}
              onChange={set("usoGlp1")}
              hint="Risco de esvaziamento gástrico retardado"
            />
          </Section>
          <Section title="Comorbidades hematológicas">
            <NumField label="Hemoglobina" value={form.hb} onChange={set("hb")} suffix="g/dL" />
            <Toggle
              label="Alguma doença que faz você sangrar fácil ou demorar para estancar o sangramento?"
              value={form.coagulopatia}
              onChange={set("coagulopatia")}
            />
            <Toggle
              label="Doença falciforme ou outra hemoglobinopatia"
              value={form.doencaFalciforme}
              onChange={set("doencaFalciforme")}
            />
            <Toggle
              label="Uso de anticoagulante"
              value={form.anticoagulante}
              onChange={set("anticoagulante")}
            />
            {form.anticoagulante && (
              <>
                <DateField
                  label="Data da última dose do anticoagulante"
                  value={form.dataUltimaDoseAnticoagulante}
                  onChange={set("dataUltimaDoseAnticoagulante")}
                />
                <TimeField
                  label="Horário da última dose"
                  value={form.horarioUltimaDoseAnticoagulante}
                  onChange={set("horarioUltimaDoseAnticoagulante")}
                  hint="Usado para estimar a janela segura para bloqueio neuroaxial — confirmar com o protocolo específico do anticoagulante em uso"
                />
              </>
            )}
          </Section>
        </>
      )}

      {step === 5 && (
        <>
          <Section title="Comorbidades neurológicas">
            <Toggle
              label="Outra doença neurológica (do cérebro ou nervos)"
              value={form.neuroDoenca}
              onChange={set("neuroDoenca")}
            />
            <Toggle label="Epilepsia (convulsões)" value={form.epilepsia} onChange={set("epilepsia")} />
            <Toggle
              label="Doença que afeta os músculos e nervos (doença neuromuscular)"
              value={form.doencaNeuromuscular}
              onChange={set("doencaNeuromuscular")}
            />
            <Toggle
              label="Doença de Parkinson"
              value={form.parkinson}
              onChange={set("parkinson")}
            />
            <Toggle
              label="Miastenia gravis"
              value={form.miasteniaGravis}
              onChange={set("miasteniaGravis")}
            />
            <Toggle
              label="Declínio cognitivo ou demência"
              value={form.declinioCognitivo}
              onChange={set("declinioCognitivo")}
            />
          </Section>
          <Section title="Comorbidades osteomusculares">
            <Toggle
              label="Mobilidade reduzida"
              value={form.mobilidadeReduzida}
              onChange={set("mobilidadeReduzida")}
            />
            <Toggle
              label="Doença de coluna (relevante p/ bloqueio)"
              value={form.doencaColuna}
              onChange={set("doencaColuna")}
            />
          </Section>
        </>
      )}

      {step === 6 && (
        <>
          <Section title="Alergias">
            <Toggle
              label="Alergia medicamentosa"
              value={form.alergiaMedicamentosa}
              onChange={set("alergiaMedicamentosa")}
            />
            {form.alergiaMedicamentosa && (
              <TextField
                label="Quais medicamentos"
                value={form.quaisAlergiasMedicamentosas}
                onChange={set("quaisAlergiasMedicamentosas")}
                placeholder="Ex: Dipirona, Penicilina..."
              />
            )}
            <Toggle
              label="Alergia a látex"
              value={form.alergiaLatex}
              onChange={set("alergiaLatex")}
            />
            <Toggle
              label="Alergia a contraste iodado"
              value={form.alergiaContraste}
              onChange={set("alergiaContraste")}
            />
          </Section>
          <Section title="Hábitos de vida">
            <NumField
              label="Tabagismo (carga)"
              value={form.tabagismoAnos}
              onChange={set("tabagismoAnos")}
              suffix="anos-maço"
              hint="Deixe em branco se não fumante"
            />
            <Toggle label="Etilismo" value={form.etilismo} onChange={set("etilismo")} />
            <Toggle label="Uso de outras drogas" value={form.drogas} onChange={set("drogas")} />
          </Section>
          <Section title="Passado cirúrgico e anestésico">
            <Toggle
              label="Cirurgias prévias"
              value={form.cirurgiasPrevias}
              onChange={set("cirurgiasPrevias")}
            />
            <Toggle
              label="Já teve algum problema ou complicação numa anestesia anterior?"
              value={form.intercorrenciaAnestesica}
              onChange={set("intercorrenciaAnestesica")}
            />
            <Toggle
              label="Já teve náusea/vômito depois de uma cirurgia, ou enjoo fácil em viagens (carro, barco, avião)?"
              value={form.historicoNveoCinetose}
              onChange={set("historicoNveoCinetose")}
            />
            <Toggle
              label="Uso previsto de opioides no pós-operatório"
              value={form.opioidePosOp}
              onChange={set("opioidePosOp")}
              hint="Se não souber, pode deixar em branco — o anestesiologista avalia na consulta"
            />
            <Toggle
              label="Algum parente de sangue já teve febre muito alta ou reação grave durante uma anestesia (hipertermia maligna)?"
              value={form.historiaFamiliarHM}
              onChange={set("historiaFamiliarHM")}
            />
          </Section>
          <Section title="Medicações de uso contínuo">
            <TextAreaField
              label="Medicações em uso"
              value={form.medicacoesUso}
              onChange={set("medicacoesUso")}
              placeholder="Ex: Losartana 50mg 1x/dia, Metformina 850mg 2x/dia, AAS 100mg 1x/dia..."
              hint="Uma por linha, com dose e posologia se possível"
            />
          </Section>
        </>
      )}

      {step === 7 && (
        <>
          {(form.nomePaciente || form.hospital || form.dataCirurgia || form.convenio) && (
            <div className="patient-header">
              {form.nomePaciente && <div className="patient-name">{form.nomePaciente}</div>}
              {form.nomeCirurgiao && (
                <div className="patient-meta">Cirurgião: {form.nomeCirurgiao}</div>
              )}
              <div className="patient-meta">
                {form.hospital &&
                  HOSPITAIS.find((h) => h.value === form.hospital)?.label}
                {form.hospital && form.convenio && " · "}
                {form.convenio}
                {(form.hospital || form.convenio) && form.dataCirurgia && " · "}
                {form.dataCirurgia &&
                  `${form.dataCirurgia.split("-").reverse().join("/")}${
                    form.horarioCirurgia ? " às " + form.horarioCirurgia : ""
                  }`}
              </div>
              {form.dataCirurgia && (
                <button className="btn-calendar" onClick={adicionarAoCalendario}>
                  Adicionar ao calendário
                </button>
              )}
              {form.hospital && (
                <>
                  <button
                    className="btn-calendar"
                    style={{ marginLeft: 8 }}
                    onClick={solicitarGuiaPorEmail}
                  >
                    Solicitar guia por e-mail
                  </button>
                  {!EMAIL_GUIA_POR_HOSPITAL[form.hospital] && (
                    <div className="hint" style={{ marginTop: 8 }}>
                      E-mail deste hospital ainda não cadastrado — o rascunho
                      abrirá sem destinatário, é só preencher manualmente.
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          <div className="section-card">
            <p style={{ margin: 0, fontSize: 15, lineHeight: 1.5 }}>
              Suas respostas foram registradas. Elas serão avaliadas e
              conferidas pelo médico anestesiologista responsável antes da
              sua consulta ou cirurgia.
            </p>
          </div>

          <button
            className="btn-primary"
            style={{ width: "100%", marginBottom: 10 }}
            onClick={enviarRespostas}
          >
            Enviar respostas
          </button>

          {respostasEnviadas && (
            <div className="info-note">
              Um PDF com suas respostas foi baixado neste dispositivo e um
              rascunho de e-mail foi aberto. Antes de enviar o e-mail,
              anexe o arquivo PDF baixado.
            </div>
          )}

          <div className="nav-row">
            <button className="btn-secondary" onClick={reset}>
              Nova avaliação
            </button>
          </div>
        </>
      )}

      {step < STEPS.length - 1 && (
        <div className="nav-row">
          {step > 0 && (
            <button className="btn-secondary" onClick={back}>
              Voltar
            </button>
          )}
          <button className="btn-primary" onClick={next}>
            {step === STEPS.length - 2 ? "Ver escores" : "Avançar"}
          </button>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
